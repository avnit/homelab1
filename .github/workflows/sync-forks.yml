name: Weekly fork sync

# Syncs every fork under @avnit to its upstream, once a week.
#
# Schedule: Friday 21:00 America/Los_Angeles.
#   GitHub cron is UTC and does NOT observe daylight saving, so this is pinned
#   to 04:00 UTC Saturday = 21:00 PDT Friday (summer). In PST (winter) it runs
#   at 20:00 Friday. Adjust the cron if you want it pinned the other way.
#
# Requires a repo secret GH_SYNC_TOKEN: a PAT that can push to your forks
# (classic token with the `repo` scope, or a fine-grained token granting
# Contents: Read and write on the forks you want synced). The built-in
# GITHUB_TOKEN cannot sync other repositories.

on:
  schedule:
    - cron: '0 4 * * 6'      # Sat 04:00 UTC  == Fri 21:00 PDT
  workflow_dispatch:          # lets you run it on demand from the Actions tab
    inputs:
      force:
        description: 'Overwrite forks that have diverged from upstream (gh repo sync --force)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all forks to their upstreams
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          OWNER: avnit
          FORCE_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_SYNC_TOKEN secret is not set. Add a PAT with 'repo' scope as a repo secret named GH_SYNC_TOKEN."
            exit 1
          fi

          echo "▶ Discovering forks for @${OWNER} …"
          gh repo list "$OWNER" --fork --limit 300 \
            --json nameWithOwner,defaultBranchRef,isArchived \
            --jq '.[] | select(.isArchived==false) | [.nameWithOwner, .defaultBranchRef.name] | @tsv' > forks.tsv
          echo "  $(wc -l < forks.tsv) active forks"
          echo

          ok=0; diverged=0; failed=0
          DIVERGED=""; FAILED=""
          while IFS=$'\t' read -r repo branch; do
            branch="${branch:-main}"
            if out=$(gh repo sync "$repo" --branch "$branch" $FORCE_FLAG 2>&1); then
              echo "✅ $repo ($branch)"
              ok=$((ok + 1))
            elif echo "$out" | grep -qiE 'diverg|conflict|not fast'; then
              echo "⚠  diverged (needs --force): $repo"
              DIVERGED="$DIVERGED $repo"; diverged=$((diverged + 1))
            else
              echo "❌ $repo: $out"
              FAILED="$FAILED $repo"; failed=$((failed + 1))
            fi
          done < forks.tsv

          echo
          echo "──────── summary ────────"
          echo "synced:   $ok"
          echo "diverged: $diverged$([ -n "$DIVERGED" ] && echo " →$DIVERGED")"
          echo "failed:   $failed$([ -n "$FAILED" ] && echo " →$FAILED")"

          # Diverged forks are expected (you have local commits on them); don't fail the run for those.
          # A real error (auth, network, missing repo) should fail so you get notified.
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed repo(s) failed to sync (see log above)."
            exit 1
          fi
